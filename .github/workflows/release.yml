name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.unreleased.outputs.release }}
      version: ${{ steps.unreleased.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The version the pending changesets bump to, for the pull request's title.
      - id: next
        run: |
          npx changeset status --output="$RUNNER_TEMP/status.json"
          echo "version=$(node -p "require('$RUNNER_TEMP/status.json').releases[0]?.newVersion ?? ''")" >> "$GITHUB_OUTPUT"

      # With pending changesets: opens or updates the "Release haul@<version>" pull request.
      - id: changesets
        uses: changesets/action@v2
        with:
          pr-title: Release haul@${{ steps.next.outputs.version }}
          commit-message: Release haul@${{ steps.next.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Once that's merged, package.json has a version with no tag yet.
      - id: unreleased
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          version="$(node -p 'require("./package.json").version')"
          release=true
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null && release=false
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign and release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      CHROME_SERVICE_ACCOUNT: ${{ secrets.CHROME_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, so the extension step can tell what changed since the previous release.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Show Xcode version
        run: xcodebuild -version

      # Fails the job if any signing secret is missing, so a release never ships unsigned.
      - name: Install signing certificate and notary key
        run: scripts/release/install-signing.sh
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Build, sign and notarize
        run: scripts/build.sh "$VERSION"
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Remove signing certificate and notary key
        if: always()
        run: scripts/release/remove-signing.sh

      - name: Tag and release
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG and publish the appcast
        run: scripts/release/publish.sh "$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A short-lived token for the Chrome Web Store's service account, through Workload Identity
      # Federation, so no Google key is stored in the repository's secrets.
      - name: Sign in to Google Cloud
        id: google
        if: env.CHROME_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.CHROME_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      # Only when BrowserExtension/ changed since the previous release; a store whose
      # credentials aren't set is skipped.
      - name: Publish the browser extension
        run: node scripts/release/extension.mjs "$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
